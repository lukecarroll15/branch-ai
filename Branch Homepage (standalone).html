  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

code-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --cream:#FBF8EE;\n    --cream-2:#F5F0E0;\n    --paper:#FFFFFF;\n    --green:#1F5A3A;\n    --green-deep:#133A26;\n    --green-soft:#E7EFE7;\n    --gold:#C9971D;\n    --gold-soft:#F4E6BE;\n    --clay:#B06A3D;\n    --clay-soft:#F2E1D4;\n    --ink:#2A2822;\n    --muted:#716E61;\n    --line:rgba(19,58,38,0.12);\n    --line-soft:rgba(19,58,38,0.07);\n    --shadow-sm:0 1px 2px rgba(19,58,38,0.05), 0 2px 8px rgba(19,58,38,0.04);\n    --shadow-md:0 4px 14px rgba(19,58,38,0.07), 0 18px 50px rgba(19,58,38,0.08);\n    --radius:18px;\n    --radius-lg:26px;\n    --maxw:1180px;\n  }\n  *{box-sizing:border-box;margin:0;padding:0;}\n  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}\n  body{\n    font-family:'Lexend',system-ui,sans-serif;\n    background:var(--cream);\n    color:var(--ink);\n    line-height:1.6;\n    font-weight:400;\n    letter-spacing:0.005em;\n    -webkit-font-smoothing:antialiased;\n    overflow-x:hidden;\n  }\n  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}\n  a{color:inherit;text-decoration:none;}\n  h1,h2,h3{color:var(--green-deep);font-weight:600;letter-spacing:-0.02em;line-height:1.12;text-wrap:balance;}\n\n  /* ---------- NAV ---------- */\n  header.nav{\n    position:sticky;top:0;z-index:50;\n    background:rgba(251,248,238,0.82);\n    backdrop-filter:blur(14px);\n    -webkit-backdrop-filter:blur(14px);\n    border-bottom:1px solid transparent;\n    transition:border-color .3s ease, background .3s ease;\n  }\n  header.nav.scrolled{border-bottom-color:var(--line-soft);}\n  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:78px;}\n  .brand{display:flex;align-items:center;gap:11px;}\n  .brand img{width:34px;height:34px;object-fit:contain;}\n  .brand span{font-size:1.32rem;font-weight:600;color:var(--green-deep);letter-spacing:-0.02em;}\n  .nav-links{display:flex;align-items:center;gap:30px;}\n  .nav-links a.menu{font-size:0.97rem;color:var(--muted);font-weight:400;transition:color .2s;}\n  .nav-links a.menu:hover{color:var(--green);}\n  .nav-cta{display:flex;align-items:center;gap:10px;}\n  .btn{\n    display:inline-flex;align-items:center;justify-content:center;gap:9px;\n    font-family:inherit;font-size:1rem;font-weight:500;cursor:pointer;\n    border-radius:12px;padding:13px 24px;border:1px solid transparent;\n    transition:transform .15s ease, box-shadow .25s ease, background .2s ease, border-color .2s ease;\n    white-space:nowrap;\n  }\n  .btn-ghost{background:transparent;color:var(--green);border-color:var(--line);}\n  .btn-ghost:hover{border-color:var(--green);background:rgba(31,90,58,0.04);}\n  .btn-primary{background:var(--green);color:#fff;box-shadow:var(--shadow-sm);}\n  .btn-primary:hover{background:var(--green-deep);transform:translateY(-1px);box-shadow:var(--shadow-md);}\n  .btn-lg{padding:16px 30px;font-size:1.06rem;}\n  .btn .arrow{transition:transform .2s ease;}\n  .btn-primary:hover .arrow{transform:translateX(3px);}\n  .nav-login{font-size:0.97rem;color:var(--green-deep);font-weight:500;padding:10px 8px;}\n\n  /* ---------- HERO ---------- */\n  .hero{position:relative;padding:74px 0 30px;}\n  .hero-grid{display:grid;grid-template-columns:1fr 1.02fr;gap:64px;align-items:center;}\n  .eyebrow{\n    display:inline-flex;align-items:center;gap:9px;\n    font-size:0.86rem;font-weight:500;color:var(--green);\n    background:var(--green-soft);border:1px solid rgba(31,90,58,0.12);\n    padding:7px 15px;border-radius:100px;letter-spacing:0.01em;margin-bottom:26px;\n  }\n  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}\n  .hero h1{font-size:clamp(2.5rem,4.6vw,3.85rem);font-weight:600;margin-bottom:22px;}\n  .hero h1 .accent{color:var(--green);position:relative;white-space:nowrap;}\n  .hero p.lede{font-size:1.2rem;color:var(--muted);max-width:34ch;margin-bottom:34px;line-height:1.62;}\n  .hero-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:38px;}\n  .trust-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}\n  .trust-row .item{display:flex;align-items:center;gap:9px;font-size:0.92rem;color:var(--muted);}\n  .trust-row .check{\n    width:20px;height:20px;border-radius:50%;background:var(--green-soft);\n    display:grid;place-items:center;flex-shrink:0;\n  }\n  .trust-row .check svg{width:11px;height:11px;}\n\n  /* ---------- PREVIEW CARD ---------- */\n  .preview{\n    position:relative;background:var(--paper);border:1px solid var(--line-soft);\n    border-radius:var(--radius-lg);box-shadow:var(--shadow-md);\n    padding:0;overflow:visible;\n  }\n  .preview::before{\n    content:\"\";position:absolute;inset:0;border-radius:var(--radius-lg);\n    background:linear-gradient(180deg,rgba(255,255,255,0.6),transparent 30%);\n    pointer-events:none;\n  }\n  .preview-bar{\n    display:flex;align-items:center;gap:8px;\n    padding:15px 20px;border-bottom:1px solid var(--line-soft);\n  }\n  .preview-bar .dots{display:flex;gap:6px;}\n  .preview-bar .dots i{width:10px;height:10px;border-radius:50%;display:block;}\n  .preview-bar .tag{\n    margin-left:auto;font-size:0.74rem;letter-spacing:0.08em;text-transform:uppercase;\n    color:var(--green);font-weight:600;display:flex;align-items:center;gap:7px;\n  }\n  .preview-bar .tag .live{width:7px;height:7px;border-radius:50%;background:#3FA66A;box-shadow:0 0 0 0 rgba(63,166,106,0.5);animation:pulse 2.2s infinite;}\n  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,166,106,0.45);}70%{box-shadow:0 0 0 7px rgba(63,166,106,0);}100%{box-shadow:0 0 0 0 rgba(63,166,106,0);}}\n  .preview-body{padding:30px 32px 30px;}\n  .preview-body .doc-title{font-size:1.55rem;font-weight:600;color:var(--green-deep);margin-bottom:6px;}\n  .preview-body .doc-sub{font-size:0.92rem;color:var(--muted);margin-bottom:22px;}\n  .note{font-size:1.12rem;line-height:1.95;color:var(--ink);font-weight:400;}\n  .note .lbl{\n    font-size:0.95rem;color:var(--muted);font-weight:400;\n  }\n\n  /* highlighted interactive terms */\n  .term{\n    position:relative;cursor:pointer;font-weight:500;border-radius:5px;\n    padding:1px 4px;margin:0 -1px;\n    text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;\n    transition:background .18s ease;white-space:nowrap;\n  }\n  .term.core{color:var(--green);text-decoration-color:rgba(31,90,58,0.4);background:rgba(31,90,58,0.06);}\n  .term.core:hover,.term.core.open{background:rgba(31,90,58,0.13);}\n  .term.support{color:#9A7415;text-decoration-color:rgba(201,151,29,0.5);background:rgba(201,151,29,0.10);}\n  .term.support:hover,.term.support.open{background:rgba(201,151,29,0.20);}\n  .term.adv{color:var(--clay);text-decoration-color:rgba(176,106,61,0.5);background:rgba(176,106,61,0.09);}\n  .term.adv:hover,.term.adv.open{background:rgba(176,106,61,0.18);}\n\n  /* popover */\n  .pop{\n    position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%) translateY(6px);\n    width:248px;background:var(--green-deep);color:#fff;border-radius:14px;padding:15px 16px 14px;\n    box-shadow:0 12px 34px rgba(19,58,38,0.28);opacity:0;visibility:hidden;\n    transition:transform .18s ease;z-index:20;text-align:left;\n    pointer-events:none;\n  }\n  .term.open .pop{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}\n  .pop::after{content:\"\";position:absolute;top:100%;left:50%;transform:translateX(-50%);\n    border:7px solid transparent;border-top-color:var(--green-deep);}\n  .pop .syl{display:block;font-size:0.95rem;font-weight:600;letter-spacing:0.04em;color:var(--gold-soft);margin-bottom:5px;line-height:1.3;}\n  .pop .mean{display:block;font-size:0.9rem;font-weight:300;line-height:1.5;color:rgba(255,255,255,0.9);}\n  .pop .hear{\n    display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:11px;\n    border-top:1px solid rgba(255,255,255,0.15);font-size:0.82rem;color:rgba(255,255,255,0.85);font-weight:400;\n  }\n  .pop .hear svg{width:15px;height:15px;flex-shrink:0;}\n\n  /* legend */\n  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:26px;padding-top:22px;border-top:1px solid var(--line-soft);}\n  .legend .key{display:flex;align-items:center;gap:8px;font-size:0.83rem;color:var(--muted);}\n  .legend .sw{width:13px;height:13px;border-radius:4px;}\n  .sw.core{background:rgba(31,90,58,0.55);}\n  .sw.support{background:rgba(201,151,29,0.6);}\n  .sw.adv{background:rgba(176,106,61,0.55);}\n  .sw.list{background:rgba(113,110,97,0.4);}\n\n  /* ---------- SECTION SHELL ---------- */\n  section{position:relative;}\n  .section-pad{padding:96px 0;}\n  .kicker{\n    font-size:0.82rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);\n    font-weight:600;margin-bottom:16px;display:block;\n  }\n  .section-head{max-width:46ch;margin-bottom:56px;}\n  .section-head.center{margin:0 auto 60px;text-align:center;}\n  .section-head h2{font-size:clamp(1.9rem,3.2vw,2.6rem);margin-bottom:16px;}\n  .section-head p{font-size:1.12rem;color:var(--muted);line-height:1.6;}\n\n  /* how it works */\n  .band{background:var(--cream-2);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}\n  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}\n  .step{\n    background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius);\n    padding:32px 28px 30px;box-shadow:var(--shadow-sm);position:relative;\n    transition:transform .25s ease, box-shadow .25s ease;\n  }\n  .step:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);}\n  .step .num{\n    width:42px;height:42px;border-radius:12px;background:var(--green-soft);color:var(--green);\n    display:grid;place-items:center;font-weight:600;font-size:1.05rem;margin-bottom:22px;\n  }\n  .step h3{font-size:1.28rem;margin-bottom:10px;}\n  .step p{color:var(--muted);font-size:1rem;line-height:1.6;}\n  .step .ico{position:absolute;top:30px;right:28px;color:var(--gold);opacity:.8;}\n  .step .ico svg{width:22px;height:22px;}\n\n  /* trust */\n  .trust-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;}\n  .tcard{\n    display:flex;gap:20px;padding:30px;border-radius:var(--radius);\n    background:var(--paper);border:1px solid var(--line-soft);box-shadow:var(--shadow-sm);\n  }\n  .tcard .ti{\n    width:46px;height:46px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;\n    background:var(--green-soft);color:var(--green);\n  }\n  .tcard .ti svg{width:23px;height:23px;}\n  .tcard h3{font-size:1.18rem;margin-bottom:8px;}\n  .tcard p{color:var(--muted);font-size:0.98rem;line-height:1.58;}\n\n  /* final cta */\n  .cta-final{position:relative;overflow:hidden;background:var(--green-deep);border-radius:var(--radius-lg);\n    padding:74px 60px;text-align:center;color:#fff;box-shadow:var(--shadow-md);}\n  .cta-final h2{color:#fff;font-size:clamp(2rem,3.4vw,2.7rem);margin-bottom:18px;max-width:20ch;margin-left:auto;margin-right:auto;}\n  .cta-final p{color:rgba(255,255,255,0.82);font-size:1.15rem;max-width:46ch;margin:0 auto 34px;font-weight:300;}\n  .cta-final .btn-primary{background:var(--gold);color:var(--green-deep);font-weight:600;}\n  .cta-final .btn-primary:hover{background:#E0AE2C;}\n  .cta-tree{position:absolute;right:-30px;bottom:-50px;width:340px;opacity:0.10;pointer-events:none;filter:brightness(0) invert(1);}\n\n  /* footer */\n  footer{padding:72px 0 40px;border-top:1px solid var(--line-soft);}\n  .foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px;margin-bottom:48px;}\n  .foot-brand .brand{margin-bottom:16px;}\n  .foot-brand p{color:var(--muted);font-size:0.96rem;max-width:34ch;line-height:1.6;}\n  .foot-col h4{font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--green-deep);margin-bottom:16px;font-weight:600;}\n  .foot-col a{display:block;color:var(--muted);font-size:0.96rem;margin-bottom:11px;transition:color .2s;}\n  .foot-col a:hover{color:var(--green);}\n  .foot-bottom{display:flex;justify-content:space-between;align-items:center;gap:18px;\n    padding-top:28px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:0.9rem;flex-wrap:wrap;}\n\n  /* reveal — base state is always visible (entrance is a no-op enhancement\n     so content is never stranded invisible in throttled/offscreen contexts) */\n  .reveal{opacity:1;transform:none;}\n\n  /* ---------- RESPONSIVE ---------- */\n  @media(max-width:940px){\n    .hero-grid{grid-template-columns:1fr;gap:46px;}\n    .hero p.lede{max-width:46ch;}\n    .steps{grid-template-columns:1fr;}\n    .trust-grid{grid-template-columns:1fr;}\n    .foot-grid{grid-template-columns:1fr 1fr;gap:32px;}\n    .nav-links .menu{display:none;}\n  }\n  @media(max-width:560px){\n    .wrap{padding:0 20px;}\n    .section-pad{padding:64px 0;}\n    .nav-login{display:none;}\n    .preview-body{padding:24px 20px;}\n    .cta-final{padding:54px 26px;}\n    .foot-grid{grid-template-columns:1fr;}\n    .hero-actions .btn{flex:1;}\n  }\n  @media(prefers-reduced-motion:reduce){\n    *{animation:none !important;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- NAV -->\n<header class=\"nav\" id=\"nav\">\n  <div class=\"wrap nav-inner\">\n    <a class=\"brand\" href=\"#top\">\n      <img src=\"9eba9ad1-c8e3-4b89-8669-e705cd36aeca\" alt=\"Branch logo\">\n      <span>Branch<\u002Fspan>\n    <\u002Fa>\n    <nav class=\"nav-links\">\n      <a class=\"menu\" href=\"#how\">How it works<\u002Fa>\n      <a class=\"menu\" href=\"#preview\">Live preview<\u002Fa>\n      <a class=\"menu\" href=\"#trust\">Why Branch<\u002Fa>\n    <\u002Fnav>\n    <div class=\"nav-cta\">\n      <a class=\"nav-login\" href=\"#\">Log in<\u002Fa>\n      <a class=\"btn btn-primary\" href=\"#\">Sign up<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section class=\"hero\" id=\"top\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy reveal\">\n      <span class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>Designed with teachers, for dyslexic students<\u002Fspan>\n      <h1>Study notes that<br>make sense — <span class=\"accent\">for the<br>way you read.<\u002Fspan><\u002Fh1>\n      <p class=\"lede\">Branch turns dense, intimidating documents into clean, colour-coded notes built for dyslexic learners. Less overwhelm, more understanding.<\u002Fp>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#\">Get started <span class=\"arrow\">→<\u002Fspan><\u002Fa>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\">See how it works<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"trust-row\">\n        <div class=\"item\"><span class=\"check\"><svg viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2.5 6.2l2.2 2.3 4.8-5\" stroke=\"#1F5A3A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>Dyslexia-friendly by design<\u002Fdiv>\n        <div class=\"item\"><span class=\"check\"><svg viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2.5 6.2l2.2 2.3 4.8-5\" stroke=\"#1F5A3A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>Private &amp; secure<\u002Fdiv>\n        <div class=\"item\"><span class=\"check\"><svg viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2.5 6.2l2.2 2.3 4.8-5\" stroke=\"#1F5A3A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>Built with educators<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- LIVE PREVIEW CARD -->\n    <div class=\"preview reveal\" id=\"preview\">\n      <div class=\"preview-bar\">\n        <div class=\"dots\"><i style=\"background:#E4775A\"><\u002Fi><i style=\"background:#E6B53C\"><\u002Fi><i style=\"background:#5AB47C\"><\u002Fi><\u002Fdiv>\n        <div class=\"tag\"><span class=\"live\"><\u002Fspan>Live preview<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"preview-body\">\n        <div class=\"doc-title\">Photosynthesis<\u002Fdiv>\n        <div class=\"doc-sub\">Tap a highlighted word to hear how it breaks down — and what it means.<\u002Fdiv>\n        <p class=\"note\">\n          <span class=\"term core\" data-syl=\"pho·to·syn·the·sis\" data-mean=\"How green plants make their own food using sunlight.\">Photosynthesis<\u002Fspan>\n          is the process plants use to\n          <span class=\"term support\" data-syl=\"con·vert\" data-mean=\"To change something into a different form.\">convert<\u002Fspan>\n          light energy into chemical energy they can store and use later. It mostly happens in the\n          <span class=\"term core\" data-syl=\"chlo·ro·plasts\" data-mean=\"Tiny parts inside a plant cell where photosynthesis takes place.\">chloroplasts<\u002Fspan>,\n          which capture sunlight. The energy is stored as\n          <span class=\"term adv\" data-syl=\"a·den·o·sine tri·phos·phate\" data-mean=\"The molecule (ATP) that cells use to store and carry energy.\">adenosine triphosphate<\u002Fspan>.\n        <\u002Fp>\n        <div class=\"legend\">\n          <span class=\"key\"><span class=\"sw core\"><\u002Fspan>Core concept<\u002Fspan>\n          <span class=\"key\"><span class=\"sw support\"><\u002Fspan>Supporting idea<\u002Fspan>\n          <span class=\"key\"><span class=\"sw adv\"><\u002Fspan>Advanced detail<\u002Fspan>\n          <span class=\"key\"><span class=\"sw list\"><\u002Fspan>List sub-point<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- HOW IT WORKS -->\n<section class=\"band section-pad\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"kicker\">How it works<\u002Fspan>\n      <h2>From overwhelming to understandable in three steps<\u002Fh2>\n      <p>No retyping, no clutter. Branch does the reformatting so students can focus on reading.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <div class=\"num\">1<\u002Fdiv>\n        <div class=\"ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16V4M7 9l5-5 5 5\"><\u002Fpath><path d=\"M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Upload your document<\u002Fh3>\n        <p>Add a PDF, a photo of your notes, or a Word file. No retyping — Branch reads it for you.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"step reveal\">\n        <div class=\"num\">2<\u002Fdiv>\n        <div class=\"ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6h16M4 12h10M4 18h7\"><\u002Fpath><circle cx=\"18\" cy=\"15\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n        <h3>We reformat it for clarity<\u002Fh3>\n        <p>Dense text becomes clean sections with colour-coded key terms — each with a phonics breakdown and a plain-English meaning.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"step reveal\">\n        <div class=\"num\">3<\u002Fdiv>\n        <div class=\"ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n        <h3>Read with confidence<\u002Fh3>\n        <p>Adjust the font, size and spacing to suit you, and tap any highlighted word whenever you need a hand.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- TRUST -->\n<section class=\"section-pad\" id=\"trust\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"kicker\">Why you can trust Branch<\u002Fspan>\n      <h2>Calm, careful, and built for real students<\u002Fh2>\n      <p>Every choice — from the colours to the way data is handled — is made to help students learn without anxiety.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"trust-grid\">\n      <div class=\"tcard reveal\">\n        <div class=\"ti\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5V5a1 1 0 011-1h11l4 4v11.5a1 1 0 01-1 1H5a1 1 0 01-1-1z\"><\u002Fpath><path d=\"M8 9h6M8 13h8M8 17h5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div><h3>Designed for dyslexia<\u002Fh3><p>The Lexend typeface, generous line spacing and a calm cream background follow established dyslexia-friendly reading practice — chosen to reduce glare and visual stress.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tcard reveal\">\n        <div class=\"ti\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z\"><\u002Fpath><path d=\"M9.5 12l1.8 1.8 3.5-3.6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div><h3>Private &amp; secure<\u002Fh3><p>Each student signs in to their own account, and uploaded documents are only ever visible to them. We don't sell data or show ads — Branch is a study tool, nothing else.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tcard reveal\">\n        <div class=\"ti\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 14c3 0 5.5-2.5 5.5-5.5S15 3 12 3 6.5 5.5 6.5 8.5 9 14 12 14z\"><\u002Fpath><path d=\"M4 21c0-3.5 3.6-6 8-6s8 2.5 8 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div><h3>Built with educators<\u002Fh3><p>Branch is shaped through a real secondary-school pilot, with teacher feedback guiding every decision. It's made for the classroom, not in spite of it.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tcard reveal\">\n        <div class=\"ti\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2 6 4-14 2 8h6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div><h3>Accessible &amp; adjustable<\u002Fh3><p>Reading isn't one-size-fits-all. Change the font, size and spacing to read the way that works for you, and lean on phonics and plain-English meanings whenever a word gets tricky.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FINAL CTA -->\n<section class=\"section-pad\" style=\"padding-top:20px;\">\n  <div class=\"wrap\">\n    <div class=\"cta-final reveal\">\n      <img class=\"cta-tree\" src=\"9eba9ad1-c8e3-4b89-8669-e705cd36aeca\" alt=\"\" aria-hidden=\"true\">\n      <h2>Ready to make studying calmer?<\u002Fh2>\n      <p>Turn your next reading into clean, colour-coded notes you can actually get through.<\u002Fp>\n      <a class=\"btn btn-primary btn-lg\" href=\"#\">Get started <span class=\"arrow\">→<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot-grid\">\n      <div class=\"foot-brand\">\n        <a class=\"brand\" href=\"#top\"><img src=\"9eba9ad1-c8e3-4b89-8669-e705cd36aeca\" alt=\"Branch logo\"><span>Branch<\u002Fspan><\u002Fa>\n        <p>A dyslexia-friendly study companion — built to make learning calmer, clearer, and more accessible for every student.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h4>Product<\u002Fh4>\n        <a href=\"#how\">How it works<\u002Fa>\n        <a href=\"#preview\">See a preview<\u002Fa>\n        <a href=\"#\">Your dashboard<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h4>Trust &amp; privacy<\u002Fh4>\n        <a href=\"#trust\">Why Branch<\u002Fa>\n        <a href=\"#\">Privacy &amp; data<\u002Fa>\n        <a href=\"mailto:info@learningwithbranch.com\">Contact us<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h4>Get started<\u002Fh4>\n        <a href=\"#\">Log in<\u002Fa>\n        <a href=\"#\">Create an account<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-bottom\">\n      <span>© 2026 Branch AI. All rights reserved.<\u002Fspan>\n      <span>Made with care for dyslexic learners 🌱<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // nav shadow on scroll\n  const nav=document.getElementById('nav');\n  addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>10));\n\n  // interactive term popovers\n  document.querySelectorAll('.term').forEach(t=>{\n    const pop=document.createElement('span');\n    pop.className='pop';\n    pop.innerHTML=`<span class=\"syl\">${t.dataset.syl}<\u002Fspan><span class=\"mean\">${t.dataset.mean}<\u002Fspan>`+\n      `<span class=\"hear\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 5L6 9H3v6h3l5 4V5z\"/><path d=\"M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13\"/><\u002Fsvg>Tap to hear it<\u002Fspan>`;\n    t.appendChild(pop);\n    const close=()=>t.classList.remove('open');\n    t.addEventListener('mouseenter',()=>{document.querySelectorAll('.term.open').forEach(x=>x!==t&&x.classList.remove('open'));t.classList.add('open');});\n    t.addEventListener('mouseleave',close);\n    t.addEventListener('click',e=>{e.stopPropagation();const o=t.classList.contains('open');document.querySelectorAll('.term.open').forEach(x=>x.classList.remove('open'));if(!o)t.classList.add('open');});\n  });\n  document.addEventListener('click',()=>document.querySelectorAll('.term.open').forEach(x=>x.classList.remove('open')));\n\n  // content is visible by default; nothing to reveal.\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
